name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 前端（測試、lint、建置）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pokedex-for-kids-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: pokedex-for-kids-web/package-lock.json
      - run: npm ci
      - name: 單元測試
        run: npm run test:ci
      - name: Lint
        run: npm run lint
      # next build 會一併做型別檢查
      - name: 建置靜態網站
        run: npm run build

  api:
    name: 後端（go vet、測試）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: game-api/go.mod
          cache-dependency-path: game-api/go.sum
      - run: go vet ./...
      # 整合測試用 testcontainers 啟動 Postgres，runner 內建 Docker
      - name: 測試
        run: go test ./...
